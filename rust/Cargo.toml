[package]
name = "shin-bucket-deployment-handler"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "shin-bucket-deployment-handler"
path = "src/main.rs"

# The provider ships as a Lambda `bootstrap` binary, so the library target exists only
# to give dev-only consumers (the criterion bench) a linkable crate. It is deliberately
# not a runtime artifact: the bin never depends on it, and its unit tests are disabled
# so `cargo test` keeps running the bin's copy of the same modules once.
[lib]
name = "shin_bucket_deployment_handler"
path = "src/lib.rs"
test = false

# The crate contains no `unsafe` and has no reason to: it is a trust-boundary parser
# for attacker-influenceable ZIP archives, and every hot path is already expressed in
# safe code. `forbid` rather than `deny` so the guard cannot be switched off locally by
# an `#[allow]`. Declared here rather than as a crate attribute so it binds every target
# in the package -- the bin, the lib, and the bench -- from one place.
# cargo-machete resolves usage by the Cargo package name and does not follow the
# hyphen-to-underscore rename, so it reports `md-5` as unused even though
# `src/replace.rs` imports it as `md5::{Digest as Md5Digest, Md5}`. Ignore it here
# rather than leaving a standing false positive that trains the reader to skip the
# tool's output.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[lints.rust]
unsafe_code = "forbid"

# The criterion bench defines its own `main` via `criterion_main!`; with the default
# test harness cargo would list it as a test target and never run the benchmarks.
[[bench]]
name = "plan_entries"
path = "benches/plan_entries.rs"
harness = false

# Off-by-default surface for the `plan-entries` criterion bench
# (`pnpm rust:bench`). The bench is a separate crate and cannot see `pub(crate)` /
# `pub(super)` items, and Rust forbids re-exporting those from a `pub` module, so
# `src/s3/bench_internals.rs` exposes a small opaque harness (new dev-only types that
# call the existing planning functions) without widening any provider visibility. It
# never affects the published package: `publish = false` applies to the whole crate,
# the feature is off by default, and `cargo bench` is a developer command only (it is
# not part of `pnpm check`).
[features]
default = []
bench-internals = []

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1"
async-compression = { version = "0.4", default-features = false, features = [
  "tokio",
  "deflate",
] }
# Keep the 0.0.20 floor: bounded external ZIP planning and the Info-ZIP/Python ZIP64
# fixtures were introduced against this Astral fork release. Track both the fork and
# upstream async_zip before upgrades because this pre-1.0 parser consumes untrusted metadata.
async_zip = { package = "astral_async_zip", version = "0.0.20", features = [
  "tokio",
  "deflate",
] }
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws_lambda_events = { version = "1", default-features = false, features = [
  "cloudformation",
] }
aws-sdk-cloudfront = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "http-1x",
  "rt-tokio",
  "sigv4a",
] }
base64 = "0.23"
bytes = "1"
crc32fast = "1"
fastrand = "2"
futures-util = "0.3"
globset = "0.4"
http-body = "1"
lambda_runtime = "1"
md-5 = "0.11"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"

[dev-dependencies]
aws-smithy-http-client = { version = "1", features = ["test-util"] }
criterion = "0.8"
http = "1"
proptest = "1.11.0"
tokio = { version = "1", features = ["test-util"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = [
  "deflate",
  "deflate64",
] }

# The provider ships as a Lambda `bootstrap` binary, so build time is paid once in CI
# while every cold start pays for the artifact.
#
# Two settings are deliberately *not* used, both because they trade away a load-bearing
# failure path for size:
#
# - `panic = "abort"`: the scheduler and archive readers rely on `catch_unwind` to turn a
#   worker panic into a reported failure instead of a hung CloudFormation stack.
# - `strip = "symbols"`: detailed failure diagnostics run the provider Lambda with
#   `RUST_BACKTRACE=1`, and a stripped symbol table reduces those opt-in backtraces to bare
#   addresses on a runtime nobody can attach a debugger to. `strip = "debuginfo"` keeps the
#   names and gives up ~4 MiB against `"symbols"` (x86_64 host build: 30.4 MB unset,
#   20.9 MB debuginfo, 16.9 MB symbols).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
