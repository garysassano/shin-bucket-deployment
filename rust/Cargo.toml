[package]
name = "shin-bucket-deployment-handler"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "shin-bucket-deployment-handler"
path = "src/main.rs"

[dependencies]
aho-corasick = "1.1.4"
anyhow = "1"
async-compression = { version = "0.4", default-features = false, features = [
  "tokio",
  "deflate",
] }
# Keep the 0.0.20 floor: bounded external ZIP planning and the Info-ZIP/Python ZIP64
# fixtures were introduced against this Astral fork release. Track both the fork and
# upstream async_zip before upgrades because this pre-1.0 parser consumes untrusted metadata.
async_zip = { package = "astral_async_zip", version = "0.0.20", features = [
  "tokio",
  "deflate",
] }
aws-config = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws_lambda_events = { version = "1", default-features = false, features = [
  "cloudformation",
] }
aws-sdk-cloudfront = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "http-1x",
  "rt-tokio",
  "sigv4a",
] }
base64 = "0.22"
bytes = "1"
crc32fast = "1"
fastrand = "2"
futures-util = "0.3"
globset = "0.4"
http-body = "1"
lambda_runtime = "1"
md-5 = "0.11"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"

[dev-dependencies]
aws-smithy-http-client = { version = "1", features = ["test-util"] }
http = "1"
proptest = "1.11.0"
tokio = { version = "1", features = ["test-util"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8", default-features = false, features = [
  "deflate",
  "deflate64",
] }

# The provider ships as a Lambda `bootstrap` binary, so build time is paid once in CI
# while every cold start pays for the artifact.
#
# Two settings are deliberately *not* used, both because they trade away a load-bearing
# failure path for size:
#
# - `panic = "abort"`: the scheduler and archive readers rely on `catch_unwind` to turn a
#   worker panic into a reported failure instead of a hung CloudFormation stack.
# - `strip = "symbols"`: detailed failure diagnostics run the provider Lambda with
#   `RUST_BACKTRACE=1`, and a stripped symbol table reduces those opt-in backtraces to bare
#   addresses on a runtime nobody can attach a debugger to. `strip = "debuginfo"` keeps the
#   names and gives up ~4 MiB against `"symbols"` (x86_64 host build: 30.4 MB unset,
#   20.9 MB debuginfo, 16.9 MB symbols).
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
