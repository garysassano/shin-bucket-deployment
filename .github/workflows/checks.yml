name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    name: Node (build, typecheck, lint, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build published package
        run: pnpm build:package

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Markdown format check
        run: pnpm check:md

      - name: Test
        run: pnpm test:ci

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise
      MISE_RUSTUP_HOME: ${{ github.workspace }}/.mise/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
          install_args: rust

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-targets: true
          cache-workspace-crates: true
          cache-all-crates: false
          cache-bin: false

      - name: Format check
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --all-features

  provider-smoke:
    name: Provider smoke (S3 mock)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise
      MISE_RUSTUP_HOME: ${{ github.workspace }}/.mise/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain and tools
        uses: jdx/mise-action@v4
        with:
          cache: true
          install_args: rust zig cargo:cargo-lambda

      - name: Install Rust target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-targets: true
          cache-workspace-crates: true
          cache-all-crates: false
          cache-bin: false
          key: provider-smoke-x86_64

      - name: Download MinIO server
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/minio" https://dl.min.io/server/minio/release/linux-amd64/minio
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/minio.sha256sum" https://dl.min.io/server/minio/release/linux-amd64/minio.sha256sum
          # The published checksum names the release artifact (minio.RELEASE.<timestamp>),
          # not the "minio" filename downloaded above, so `sha256sum -c` on it as-is fails
          # to find the file. Re-point the recorded digest at the local name.
          printf '%s  minio\n' "$(cut -d' ' -f1 "$RUNNER_TEMP/minio.sha256sum")" > "$RUNNER_TEMP/minio.sha256.local"
          (cd "$RUNNER_TEMP" && sha256sum -c minio.sha256.local)
          chmod +x "$RUNNER_TEMP/minio"

      - name: Download Lambda Runtime Interface Emulator
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/aws-lambda-rie" https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/latest/download/aws-lambda-rie
          chmod +x "$RUNNER_TEMP/aws-lambda-rie"

      - name: Run provider smoke test against a local S3 mock
        run: node scripts/smoke-provider.mjs
        env:
          MINIO_BIN: ${{ runner.temp }}/minio
          RIE_BIN: ${{ runner.temp }}/aws-lambda-rie

  supply-chain:
    name: Supply chain (npm audit, cargo audit, cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise
      MISE_RUSTUP_HOME: ${{ github.workspace }}/.mise/rustup
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Setup Rust supply-chain tools
        uses: jdx/mise-action@v4
        with:
          cache: true
          install_args: rust cargo:cargo-audit cargo:cargo-deny

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `high` rather than `moderate` is deliberate: npm dependencies here are
      # almost entirely development-time and are not part of the published
      # runtime. See the supply chain section of SECURITY.md.
      - name: npm audit
        run: pnpm audit --audit-level high

      - name: cargo audit
        run: cargo audit --file rust/Cargo.lock

      - name: cargo deny
        run: pnpm rust:deny

  workflow-quality:
    name: Workflow and TOML quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Setup workflow tools
        uses: jdx/mise-action@v4
        with:
          cache: true
          install_args: actionlint ripgrep taplo

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Verify major-version action references
        run: |
          if rg --pcre2 '^\s*(?:-\s*)?uses:\s+(?!\./)[^@\s]+@(?!v(?:0|[1-9][0-9]*)(?:\s|$))' .github/workflows; then
            echo "Every external action must be referenced by a major version tag, for example @v4." >&2
            echo "Branch refs, commit SHAs, and pinned patch versions such as @v4.1.2 are rejected." >&2
            exit 1
          fi

      - name: Check TOML formatting
        run: taplo fmt --check mise.toml rust/Cargo.toml rust/deny.toml

  bootstrap:
    name: Bootstrap (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-gnu
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
    env:
      MISE_DATA_DIR: ${{ github.workspace }}/.mise
      MISE_RUSTUP_HOME: ${{ github.workspace }}/.mise/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Setup Rust toolchain and tools
        uses: jdx/mise-action@v4
        with:
          cache: true
          install_args: rust zig cargo:cargo-lambda

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-targets: true
          cache-workspace-crates: true
          cache-all-crates: false
          cache-bin: false
          key: bootstrap-${{ matrix.target }}

      - name: Build bootstrap
        run: node scripts/build-bootstrap.mjs ${{ matrix.arch }}

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ matrix.arch }}
          path: |
            assets/bootstrap-${{ matrix.arch }}/bootstrap.zip
            assets/bootstrap-${{ matrix.arch }}/build-provenance.json
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package contract (Node LTS)
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download arm64 bootstrap
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-arm64
          path: assets/bootstrap-arm64

      - name: Download x86_64 bootstrap
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-x86_64
          path: assets/bootstrap-x86_64

      - name: Verify package contract
        run: pnpm verify:package

      # actions/checkout fetches only the single checked-out commit, so the
      # pull request base SHA is not in the local object store. Fetch just
      # that commit instead of the full history (fetch-depth: 0).
      - name: Fetch pull request base for contract baseline
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.event.pull_request.base.sha }}"

      - name: Verify TypeScript contract against pull request base
        if: github.event_name == 'pull_request'
        run: pnpm verify:typescript-contract -- --baseline-ref "${{ github.event.pull_request.base.sha }}"

      - name: Verify TypeScript contract self-check
        if: github.event_name != 'pull_request'
        run: pnpm verify:typescript-contract -- --baseline-ref HEAD

  synth:
    name: Synth verification scenarios
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download arm64 bootstrap
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-arm64
          path: assets/bootstrap-arm64

      - name: Download x86_64 bootstrap
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-x86_64
          path: assets/bootstrap-x86_64

      - name: Verify bootstrap archives are present
        run: |
          test -f assets/bootstrap-arm64/bootstrap.zip
          test -f assets/bootstrap-x86_64/bootstrap.zip

      - name: Synthesize verification scenarios
        run: pnpm verify synth

  benchmark-synth:
    name: Synth benchmark applications
    needs: bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download arm64 bootstrap
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-arm64
          path: assets/bootstrap-arm64

      - name: Synthesize benchmark applications without AWS access
        run: pnpm benchmark:synth
