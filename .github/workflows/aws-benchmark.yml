name: AWS Benchmark
run-name: AWS benchmark five parallel repetitions for ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact 40-character commit to benchmark
        required: true
        type: string
      snapshot_date:
        description: Fixed UTC evidence date (YYYY-MM-DD)
        required: true
        type: string
      run_id:
        description: Opaque benchmark run UUID
        required: true
        type: string
      decision_run_id:
        description: Sanitized decision-run label
        required: true
        type: string
      comparison_variant:
        description: Sanitized variant label such as before or current
        required: true
        type: string
      implementations:
        description: Comma-separated implementations (shin or shin,aws)
        required: true
        default: shin,aws
        type: string
      max_wall_clock_minutes:
        description: Approved wall-clock cap for each repetition
        required: true
        type: number
      publish_results:
        description: Publish the complete five-repetition run to main
        required: true
        default: true
        type: boolean

concurrency:
  group: aws-test-account
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  AWS_REGION: eu-central-1
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  prepare:
    name: Prepare measured provider
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MISE_DATA_DIR: /tmp/shin-mise
      MISE_RUSTUP_HOME: /tmp/shin-mise/rustup
      CARGO_TARGET_DIR: /tmp/shin-cargo-target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Validate shared inputs
        env:
          IMPLEMENTATIONS: ${{ inputs.implementations }}
          RUN_ID: ${{ inputs.run_id }}
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          [[ "$RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          [[ "$SNAPSHOT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$IMPLEMENTATIONS" == "shin" || "$IMPLEMENTATIONS" == "shin,aws" ]]

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Setup provider toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
          install_args: rust zig cargo:cargo-lambda

      - name: Install Rust target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          cache-targets: true
          cache-workspace-crates: true
          cache-all-crates: false
          cache-bin: false
          key: aws-benchmark-arm64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build exact measured provider once
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          evidence_file="${GITHUB_WORKSPACE%/*}/shin-benchmark-provider/$RUN_ID/results.jsonl"
          mkdir -p "$(dirname "$evidence_file")"
          pnpm build
          node scripts/build-bootstrap.mjs \
            --benchmark \
            --evidence-output "$evidence_file" \
            arm64
          test -s assets/bootstrap-arm64/bootstrap.zip
          test -s assets/bootstrap-arm64/build-provenance.json

      - name: Upload measured provider
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-provider-${{ inputs.run_id }}-${{ github.run_attempt }}
          path: |
            assets/bootstrap-arm64/bootstrap.zip
            assets/bootstrap-arm64/build-provenance.json
          if-no-files-found: error
          retention-days: 14

  benchmark:
    name: Repetition ${{ matrix.repetition }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        repetition: [1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: aws-benchmarks
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      MISE_DATA_DIR: /tmp/shin-mise
      MISE_RUSTUP_HOME: /tmp/shin-mise/rustup
      CARGO_TARGET_DIR: /tmp/shin-cargo-target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Guard measured source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REF"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Setup benchmark toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true
          install_args: rust zig cargo:cargo-lambda

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download measured provider
        uses: actions/download-artifact@v8
        with:
          name: benchmark-provider-${{ inputs.run_id }}-${{ github.run_attempt }}
          path: assets/bootstrap-arm64

      - name: Validate measured provider artifact
        run: |
          test -s assets/bootstrap-arm64/bootstrap.zip
          test -s assets/bootstrap-arm64/build-provenance.json

      - name: Prepare repetition evidence paths
        env:
          REPETITION: ${{ matrix.repetition }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          evidence_root="${GITHUB_WORKSPACE%/*}/shin-benchmark-evidence/$RUN_ID/repetition-$REPETITION"
          {
            echo "EVIDENCE_ROOT=$evidence_root"
            echo "RESULTS_FILE=$evidence_root/results.jsonl"
            echo "SCRATCH_ROOT=$evidence_root/scratch"
          } >>"$GITHUB_ENV"
          mkdir -p "$evidence_root/scratch"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BENCHMARKS_ROLE_ARN }}
          role-session-name: shin-benchmark-${{ github.run_id }}-r${{ matrix.repetition }}
          role-duration-seconds: 14400
          mask-aws-account-id: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Run full benchmark repetition
        env:
          COMPARISON_VARIANT: ${{ inputs.comparison_variant }}
          DECISION_RUN_ID: ${{ inputs.decision_run_id }}
          IMPLEMENTATIONS: ${{ inputs.implementations }}
          MAX_WALL_CLOCK_MINUTES: ${{ inputs.max_wall_clock_minutes }}
          REPETITION: ${{ matrix.repetition }}
          RUN_ID: ${{ inputs.run_id }}
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: |
          pnpm benchmark:run-assets -- \
            --config benchmarks/configs/readme-snapshots.json \
            --run-id "$RUN_ID" \
            --start-repetition "$REPETITION" \
            --repetitions 1 \
            --approved-through-repetition 5 \
            --max-wall-clock-minutes "$MAX_WALL_CLOCK_MINUTES" \
            --implementations "$IMPLEMENTATIONS" \
            --output-file "$RESULTS_FILE" \
            --scratch-root "$SCRATCH_ROOT" \
            --snapshot-date "$SNAPSHOT_DATE" \
            --decision-run-id "$DECISION_RUN_ID" \
            --comparison-variant "$COMPARISON_VARIANT"

      - name: Stage sanitized repetition evidence
        run: |
          shard="$RUNNER_TEMP/benchmark-shard"
          mkdir -p "$shard"
          cp "$RESULTS_FILE" "$shard/results.jsonl"
          cp "$EVIDENCE_ROOT/runs.jsonl" "$shard/runs.jsonl"
          cp "$SCRATCH_ROOT/benchmark-run-manifest.json" "$shard/benchmark-run-manifest.json"
          diff -u \
            <(printf '%s\n' benchmark-run-manifest.json results.jsonl runs.jsonl | sort) \
            <(find "$shard" -type f -printf '%P\n' | sort)
          test -z "$(find "$shard" -type f -empty -print -quit)"

      - name: Upload sanitized repetition evidence
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-shard-${{ inputs.run_id }}-${{ github.run_attempt }}-r${{ matrix.repetition }}
          path: ${{ runner.temp }}/benchmark-shard
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Validate and aggregate five repetitions
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reporting tools
        run: pnpm build

      - name: Download repetition artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-shard-${{ inputs.run_id }}-${{ github.run_attempt }}-r*
          path: ${{ runner.temp }}/benchmark-shards

      - name: Prepare aggregate evidence paths
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          evidence_root="${GITHUB_WORKSPACE%/*}/shin-benchmark-evidence/$RUN_ID/complete"
          {
            echo "EVIDENCE_ROOT=$evidence_root"
            echo "RESULTS_FILE=$evidence_root/results.jsonl"
            echo "SCRATCH_ROOT=$evidence_root/scratch"
          } >>"$GITHUB_ENV"
          mkdir -p "$evidence_root/scratch"

      - name: Merge and validate repetition evidence
        run: |
          node dist/benchmarks/src/merge-shards.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-directory "$RUNNER_TEMP/benchmark-shards" \
            --output-file "$RESULTS_FILE" \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT"

      - name: Stage complete benchmark evidence
        run: |
          complete="$RUNNER_TEMP/benchmark-complete"
          mkdir -p "$complete"
          cp "$RESULTS_FILE" "$complete/results.jsonl"
          cp "$EVIDENCE_ROOT/runs.jsonl" "$complete/runs.jsonl"
          cp "$SCRATCH_ROOT/benchmark-run-manifest.json" "$complete/benchmark-run-manifest.json"

      - name: Upload complete benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-complete-${{ inputs.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-complete
          if-no-files-found: error
          retention-days: 14

      - name: Prepare benchmark report paths
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          report_root="$RUNNER_TEMP/benchmark-report-$RUN_ID"
          echo "REPORT_ROOT=$report_root" >>"$GITHUB_ENV"
          mkdir -p "$report_root/snapshots"
          cp "$RESULTS_FILE" "$report_root/results.jsonl"
          cp "$EVIDENCE_ROOT/runs.jsonl" "$report_root/runs.jsonl"

      - name: Render Actions summary
        run: |
          node dist/benchmarks/src/render/ci-summary.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-file "$REPORT_ROOT/summary.md" \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT" \
            --preview false
          cat "$REPORT_ROOT/summary.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Render comparison report
        run: |
          node dist/benchmarks/src/render/comparison-report.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-file "$REPORT_ROOT/report.md" \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT" \
            --preview false

      - name: Render provider telemetry
        run: |
          node dist/benchmarks/src/render/telemetry-table.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-file "$REPORT_ROOT/telemetry.md" \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT" \
            --preview false

      - name: Render profile snapshots
        if: ${{ inputs.implementations == 'shin,aws' }}
        run: |
          node dist/benchmarks/src/render/readme-snapshot.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-directory "$REPORT_ROOT/snapshots" \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT" \
            --preview false

      - name: Validate benchmark report contents
        env:
          IMPLEMENTATIONS: ${{ inputs.implementations }}
        run: |
          expected=(report.md results.jsonl runs.jsonl summary.md telemetry.md)
          if [[ "$IMPLEMENTATIONS" == "shin,aws" ]]; then
            expected+=(
              snapshots/large-few-1024mib-32.svg
              snapshots/large-few-2048mib-64.svg
              snapshots/mixed-1024mib-32.svg
              snapshots/mixed-2048mib-64.svg
              snapshots/tiny-many-1024mib-32.svg
              snapshots/tiny-many-2048mib-64.svg
            )
          fi
          diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(find "$REPORT_ROOT" -type f -printf '%P\n' | sort)
          test -z "$(find "$REPORT_ROOT" -type f -empty -print -quit)"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report-${{ inputs.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_ROOT }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete benchmark
    if: ${{ inputs.implementations == 'shin,aws' && inputs.publish_results }}
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Guard reporting revision and measured source
        env:
          REPORTING_REF: ${{ github.sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPORTING_REF" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$REPORTING_REF"
          test "$(git rev-parse origin/main)" = "$REPORTING_REF"
          git cat-file -e "$SOURCE_REF^{commit}"
          git merge-base --is-ancestor "$SOURCE_REF" "$REPORTING_REF"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download complete benchmark evidence
        uses: actions/download-artifact@v8
        with:
          name: benchmark-complete-${{ inputs.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-complete

      - name: Restore publication evidence paths
        env:
          RUN_ID: ${{ inputs.run_id }}
        run: |
          evidence_root="${GITHUB_WORKSPACE%/*}/shin-benchmark-evidence/$RUN_ID"
          {
            echo "EVIDENCE_ROOT=$evidence_root"
            echo "RESULTS_FILE=$evidence_root/results.jsonl"
            echo "SCRATCH_ROOT=$evidence_root/scratch"
          } >>"$GITHUB_ENV"
          mkdir -p "$evidence_root/scratch"
          cp "$RUNNER_TEMP/benchmark-complete/results.jsonl" "$evidence_root/results.jsonl"
          cp "$RUNNER_TEMP/benchmark-complete/runs.jsonl" "$evidence_root/runs.jsonl"
          cp "$RUNNER_TEMP/benchmark-complete/benchmark-run-manifest.json" "$evidence_root/scratch/benchmark-run-manifest.json"

      - name: Build reporting tools
        run: pnpm build

      - name: Merge validated structured evidence
        run: |
          node dist/benchmarks/src/publish-results.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-file benchmarks/results.jsonl \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT"

      - name: Render committed comparison report
        run: |
          node dist/benchmarks/src/render/comparison-report.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-file benchmarks/ci-report.md \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT"

      - name: Render committed provider telemetry
        run: |
          node dist/benchmarks/src/render/telemetry-table.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-file benchmarks/ci-telemetry.md \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT"

      - name: Render committed profile snapshots
        run: |
          node dist/benchmarks/src/render/readme-snapshot.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-directory benchmarks/snapshots \
            --filename-prefix ci- \
            --manifest-file benchmarks/snapshots/manifest.json \
            --manifest-mode replace \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT"
          node dist/benchmarks/src/render/readme-snapshot.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --output-directory benchmarks/snapshots \
            --lambda-memory-mb 2048 \
            --transfer-max-concurrency 64 \
            --manifest-file benchmarks/snapshots/manifest.json \
            --manifest-mode merge \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT"

      - name: Update generated benchmark documentation
        run: |
          node dist/benchmarks/src/render/update-ci-docs.js \
            --config benchmarks/configs/readme-snapshots.json \
            --input-file "$RESULTS_FILE" \
            --run-id "${{ inputs.run_id }}" \
            --scratch-root "$SCRATCH_ROOT" \
            --docs-file docs/benchmark.md \
            --benchmark-readme benchmarks/README.md

      - name: Format generated markdown
        run: pnpm exec prettier --write benchmarks/ci-report.md benchmarks/ci-telemetry.md benchmarks/README.md docs/benchmark.md

      - name: Verify published benchmark snapshots
        run: pnpm exec vitest run test/benchmarks/readme-snapshot.test.ts test/benchmarks/assets.test.ts

      - name: Validate publication diff
        run: |
          test -s benchmarks/ci-report.md
          test -s benchmarks/ci-telemetry.md
          test -s benchmarks/runs.jsonl
          test -s benchmarks/snapshots/ci-large-few-1024mib-32.svg
          test -s benchmarks/snapshots/ci-large-few-2048mib-64.svg
          test -s benchmarks/snapshots/ci-mixed-1024mib-32.svg
          test -s benchmarks/snapshots/ci-mixed-2048mib-64.svg
          test -s benchmarks/snapshots/ci-tiny-many-1024mib-32.svg
          test -s benchmarks/snapshots/ci-tiny-many-2048mib-64.svg
          test -s benchmarks/snapshots/large-few-2048mib-64.svg
          test -s benchmarks/snapshots/mixed-2048mib-64.svg
          test -s benchmarks/snapshots/tiny-many-2048mib-64.svg
          test -s benchmarks/snapshots/manifest.json
          git add \
            benchmarks/results.jsonl \
            benchmarks/runs.jsonl \
            benchmarks/ci-report.md \
            benchmarks/ci-telemetry.md \
            benchmarks/snapshots/ci-large-few-1024mib-32.svg \
            benchmarks/snapshots/ci-large-few-2048mib-64.svg \
            benchmarks/snapshots/ci-mixed-1024mib-32.svg \
            benchmarks/snapshots/ci-mixed-2048mib-64.svg \
            benchmarks/snapshots/ci-tiny-many-1024mib-32.svg \
            benchmarks/snapshots/ci-tiny-many-2048mib-64.svg \
            benchmarks/snapshots/large-few-2048mib-64.svg \
            benchmarks/snapshots/mixed-2048mib-64.svg \
            benchmarks/snapshots/tiny-many-2048mib-64.svg \
            benchmarks/snapshots/manifest.json \
            benchmarks/README.md \
            docs/benchmark.md
          git diff --cached --check
          git diff --check
          unexpected="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //;' | rg -v '^(benchmarks/results\.jsonl|benchmarks/runs\.jsonl|benchmarks/ci-report\.md|benchmarks/ci-telemetry\.md|benchmarks/snapshots/(ci-(large-few|mixed|tiny-many)-(1024mib-32|2048mib-64)|(large-few|mixed|tiny-many)-2048mib-64)\.svg|benchmarks/snapshots/manifest\.json|benchmarks/README\.md|docs/benchmark\.md)$' || true)"
          test -z "$unexpected"

      - name: Commit and push benchmark publication
        env:
          REPORTING_REF: ${{ github.sha }}
          SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$REPORTING_REF"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: publish benchmark $SNAPSHOT_DATE [skip ci]"
          git push origin HEAD:main
