# The provider build toolchain (rust, cargo-lambda, zig) is pinned exactly: the
# published package ships prebuilt bootstrap.zip binaries, so a floating version
# lets the same tag rebuild to different bytes. Node tracks a major; pnpm matches
# package.json's packageManager pin used by CI.
# See the supply chain section of SECURITY.md.
[tools]
actionlint = "1.7.12"
node = "24"
pnpm = "12.6.0"
ripgrep = "15.1.0"
rust = "1.97.1"
taplo = "0.10.0"
zig = "0.16.0"
cargo-binstall = "1.23.0"
"cargo:cargo-lambda" = { version = "1.9.1", depends = ["cargo-binstall"] }
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
"cargo:cargo-deny" = { version = "0.19.9", depends = ["cargo-binstall"] }

[settings]
cargo.binstall_only = true
